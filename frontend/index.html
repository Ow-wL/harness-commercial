<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리동네 상권분석 매니저</title>
    <!-- 12-5: 링크 공유·검색용 메타. 서비스 URL·클라우드 식별정보는 넣지 않는다 -->
    <meta
      name="description"
      content="인천에서 가게를 열 위치와 업종을 고르면 공공데이터 다섯 관점(시장성·고객성·경쟁성·입지성·안정성)으로 상권을 살펴보는 참고 지표입니다. 순위나 매출 예측이 아닙니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="우리동네 상권분석 매니저" />
    <meta
      property="og:description"
      content="인천 지도에서 위치와 업종을 고르면 공공데이터 다섯 관점으로 상권을 살펴봅니다. 참고 지표이며 순위·매출 예측이 아닙니다."
    />
    <meta property="og:locale" content="ko_KR" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 테마를 첫 그리기 전에 건다(깜빡임 방지). 규칙은 src/lib/theme.ts와 같다: 저장된 선택 > 시스템 설정 > 다크 -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = window.localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
