<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리동네 상권분석 매니저</title>
    <!-- 12-5: 링크 공유·검색용 메타. 클라우드 식별정보(프로젝트 번호 형식 주소 등)는 넣지 않는다.
         13-51(사용자 결정 2026-11-26): 링크 미리보기 이미지는 절대 주소가 필요해 공개된 짧은 주소(.web.app)만 쓴다 -->
    <meta
      name="description"
      content="인천에서 가게를 열 위치와 업종을 고르면 공공데이터 다섯 관점(시장성·고객성·경쟁성·입지성·안정성)으로 상권을 살펴보는 참고 지표입니다. 순위나 매출 예측이 아닙니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="우리동네 상권분석 매니저" />
    <meta
      property="og:description"
      content="인천 지도에서 위치와 업종을 고르면 공공데이터 다섯 관점으로 상권을 살펴봅니다. 참고 지표이며 순위·매출 예측이 아닙니다."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://harness-commercial.web.app/" />
    <meta property="og:image" content="https://harness-commercial.web.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 13-50: 홈 화면 아이콘·앱 이름·브라우저 위쪽 띠 색. 색은 아래 스크립트가 고른 테마에 맞춘다(다크 #07080A · 라이트 #F5F7FA = --color-bg) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07080A" />
    <!-- 테마를 첫 그리기 전에 건다(깜빡임 방지). 규칙은 src/lib/theme.ts와 같다: 저장된 선택 > 다크(시스템 설정은 보지 않는다) -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = window.localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        var bar = document.querySelector('meta[name="theme-color"]')
        if (bar && theme === 'light') bar.setAttribute('content', '#F5F7FA')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
