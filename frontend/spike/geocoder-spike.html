<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geocoder 스파이크 (7-B0)</title>
    <style>
      body { margin: 24px; font: 14px/1.5 system-ui, sans-serif; color: #17202b; }
      button { min-height: 40px; padding: 0 16px; margin-right: 8px; }
      pre { padding: 12px; background: #eef1f5; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>Geocoder 스파이크 (docs/ADDRESS_DESIGN.md 7-B0)</h1>
    <p>
      개발 서버 전용 페이지(빌드에 포함되지 않는다). NAVER Maps SDK를 <code>submodules=geocoder</code>로 <strong>한 번만</strong> 로드하고,
      버튼을 누를 때마다 정확히 1회 호출한다. Client ID는 <code>.env</code>의 <code>VITE_NAVER_MAP_CLIENT_ID</code>를 쓰며 화면·로그에 쓰지 않는다.
    </p>
    <p>
      <button id="rev" type="button" disabled>역방향 1회 (부평역 좌표)</button>
      <button id="fwd" type="button" disabled>정방향 1회 ("인천광역시 부평구 부평대로 1")</button>
    </p>
    <pre id="log" aria-live="polite"></pre>
    <script type="module">
      const clientId = import.meta.env.VITE_NAVER_MAP_CLIENT_ID
      const logEl = document.getElementById('log')
      const log = (label, value) => {
        const text = value === undefined ? '' : ' ' + JSON.stringify(value, null, 2)
        logEl.textContent += `[${new Date().toISOString().slice(11, 19)}] ${label}${text}\n`
      }
      window.__spike = { reverse: null, forward: null }

      if (!clientId) {
        log('config: VITE_NAVER_MAP_CLIENT_ID가 없다 (frontend/.env)')
      } else {
        window.navermap_authFailure = () => log('AUTH FAILURE: navermap_authFailure 호출됨 (Web 서비스 URL·Client ID 확인)')
        const snapshot = () => {
          const service = window.naver?.maps?.Service
          return { maps: !!window.naver?.maps, Service: !!service, geocode: typeof service?.geocode, reverseGeocode: typeof service?.reverseGeocode }
        }
        const t0 = performance.now()
        const enable = () => { for (const id of ['rev', 'fwd']) document.getElementById(id).disabled = false }
        // SDK의 callback 파라미터: 서브모듈까지 준비된 뒤 불리는지 확인한다 (maps.js의 load 이벤트는 서브모듈보다 먼저 온다)
        window.__spikeReady = () => {
          log(`callback=__spikeReady ${Math.round(performance.now() - t0)}ms`, snapshot())
          if (window.naver?.maps?.Service) enable()
        }
        const script = document.createElement('script')
        script.async = true
        script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(clientId)}&submodules=geocoder&callback=__spikeReady`
        script.addEventListener('load', () => {
          log(`maps.js load 이벤트 ${Math.round(performance.now() - t0)}ms`, snapshot())
          // fallback: 서브모듈 스크립트(maps-geocoder.js)가 뒤에 붙으므로 Service가 생길 때까지 폴링 (최대 10초)
          const poll = setInterval(() => {
            if (window.naver?.maps?.Service) {
              clearInterval(poll)
              log(`Service 감지(폴링) ${Math.round(performance.now() - t0)}ms`, snapshot())
              enable()
            } else if (performance.now() - t0 > 10000) {
              clearInterval(poll)
              log('Service 없음 (10초) — 서브모듈 로드 실패')
            }
          }, 100)
        })
        script.addEventListener('error', () => log('SDK load error'))
        document.head.appendChild(script)
      }

      // 호출은 버튼당 1회만 (두 번째 누름은 무시)
      const once = (id, run) => {
        const btn = document.getElementById(id)
        btn.addEventListener('click', () => {
          btn.disabled = true
          run()
        })
      }

      once('rev', () => {
        const t0 = performance.now()
        log('reverseGeocode 호출: coords 126.7246,37.4894 orders roadaddr,addr')
        window.naver.maps.Service.reverseGeocode(
          { coords: '126.7246,37.4894', orders: 'roadaddr,addr' },
          (status, response) => {
            window.__spike.reverse = { status, response }
            log(`reverseGeocode 콜백 ${Math.round(performance.now() - t0)}ms`, { status, v2: response?.v2 })
          },
        )
      })

      once('fwd', () => {
        const t0 = performance.now()
        log('geocode 호출: query "인천광역시 부평구 부평대로 1", coordinate 126.7052,37.4563, count 5')
        window.naver.maps.Service.geocode(
          { query: '인천광역시 부평구 부평대로 1', coordinate: '126.7052,37.4563', count: 5 },
          (status, response) => {
            window.__spike.forward = { status, response }
            log(`geocode 콜백 ${Math.round(performance.now() - t0)}ms`, { status, v2: response?.v2 })
          },
        )
      })
    </script>
  </body>
</html>
